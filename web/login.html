<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Asistente cripto</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; color-scheme: dark; background: radial-gradient(ellipse at top, #17223a, #08090d 65%); color: #eef0f6; font: 15px/1.5 system-ui, sans-serif; }
  main { width: min(100%, 410px); padding: clamp(24px, 7vw, 40px); background: #11141c; border: 1px solid #293246; border-radius: 24px; box-shadow: 0 24px 80px #0007; }
  .mark { display: grid; place-items: center; margin: 0 auto 18px; width: 68px; height: 68px; border-radius: 20px; background: #f8c577; color: #221504; font-size: 44px; font-weight: 750; }
  h1 { margin: 0; text-align: center; font-size: 28px; letter-spacing: -.035em; }
  header p { text-align: center; color: #a5abbc; margin: 6px 0 26px; }
  form { display: grid; gap: 8px; }
  input, button { font: inherit; border-radius: 12px; padding: 12px 14px; }
  input { width: 100%; min-width: 0; margin-bottom: 8px; background: #090c13; color: inherit; border: 1px solid #344056; }
  button { margin-top: 6px; border: 0; background: #a7c3ff; color: #10182a; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .65; cursor: wait; }
  :focus-visible { outline: 2px solid #a7c3ff; outline-offset: 3px; }
  #error { color: #ffb4ab; margin: 4px 0 0; }
  #error:empty { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark" aria-hidden="true">&#8383;</div>
    <h1>Asistente cripto</h1>
    <p>Inicia sesión para entrar al chat.</p>
  </header>
  <form id="login" method="post" action="/app/login">
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" maxlength="64" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
    <button type="submit">Iniciar sesión</button>
    <p id="error" role="alert"></p>
  </form>
</main>
<script>
  const form = document.getElementById('login');
  const error = document.getElementById('error');
  const button = form.querySelector('button');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    error.textContent = '';
    button.disabled = true;
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      if (response.ok) {
        window.location.replace('/app');
        return;
      }
      error.textContent = response.status === 401
        ? 'Usuario o contraseña incorrectos.'
        : 'No se pudo iniciar sesión. Intenta nuevamente.';
    } catch {
      error.textContent = 'No se pudo conectar con el agente.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
